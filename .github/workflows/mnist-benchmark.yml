name: MNIST benchmark checks

on:
  push:
    paths:
      - "03_Deep_Learning/02_mnist-cnn-benchmark/**"
      - ".github/workflows/mnist-benchmark.yml"
  pull_request:
    paths:
      - "03_Deep_Learning/02_mnist-cnn-benchmark/**"
      - ".github/workflows/mnist-benchmark.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_Deep_Learning/02_mnist-cnn-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run no-download training smoke test
        run: python src/smoke_test.py
